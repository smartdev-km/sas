databases:
  - name: sas-db
    plan: free
    databaseName: sas_db
    user: sas_user

services:
  - type: web
    name: sas
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'if [ -n "$DATABASE_URL" ]; then flask db upgrade; fi; gunicorn run:app'
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sas-db
          property: connectionString
