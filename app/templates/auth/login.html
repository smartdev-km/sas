{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block auth_content %}
<div class="sas-login-wrapper">
    <div class="card sas-login-card shadow-sm">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-hexagon-fill fs-1 text-primary"></i>
                <h1 class="h4 mt-2 mb-0">SAS</h1>
                <p class="text-muted small">Connectez-vous à votre espace de gestion</p>
            </div>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label" for="identifiant">Email ou nom d'utilisateur</label>
                    <input type="text" class="form-control" id="identifiant" name="identifiant" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
