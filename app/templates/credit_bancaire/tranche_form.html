{% extends "base.html" %}
{% block title %}{{ "Modifier" if tranche else "Nouvelle" }} tranche{% endblock %}
{% block content %}
<div class="mb-4">
    <h1 class="h3 mb-0">{{ "Modifier la tranche" if tranche else "Ajouter une tranche" }}</h1>
    <p class="text-muted mb-0">
        <a href="{{ url_for('credit_bancaire.detail', credit_id=credit.id) }}" class="text-decoration-none">
            <i class="bi bi-arrow-left"></i> Retour à {{ credit.banque }}
        </a>
    </p>
</div>

<form method="post">
    <div class="card mb-3" style="max-width: 600px;">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="date">Date *</label>
                    <input type="date" class="form-control" id="date" name="date" value="{{ form.date or '' }}" required>
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="montant_tranche">Tranche versée (KMF) *</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="montant_tranche" name="montant_tranche" value="{{ form.montant_tranche if form.montant_tranche is not none else '' }}" required>
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="frais_prealable">Frais préalable (KMF)</label>
                    <input type="number" step="0.01" min="0" class="form-control" id="frais_prealable" name="frais_prealable" value="{{ form.frais_prealable if form.frais_prealable is not none else '' }}" placeholder="0">
                </div>
                <div class="col-12">
                    <label class="form-label" for="notes">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="3">{{ form.notes or '' }}</textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2 mb-4">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg"></i> {{ "Enregistrer" if tranche else "Ajouter" }}
        </button>
        <a href="{{ url_for('credit_bancaire.detail', credit_id=credit.id) }}" class="btn btn-outline-secondary">Annuler</a>
    </div>
</form>
{% endblock %}
