{% extends "base.html" %}
{% block title %}{{ "Modifier" if client else "Nouveau" }} client{% endblock %}
{% block content %}
<div class="mb-4">
    <h1 class="h3 mb-0">{{ "Modifier le client" if client else "Nouveau client" }}</h1>
    <p class="text-muted mb-0">
        <a href="{{ url_for('commercial.liste') }}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Retour à la liste</a>
    </p>
</div>

<div class="card" style="max-width: 720px;">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="date_contact">Date contact *</label>
                    <input type="date" class="form-control" id="date_contact" name="date_contact" value="{{ form.date_contact or '' }}" required>
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="nom_client">Nom du client *</label>
                    <input type="text" class="form-control" id="nom_client" name="nom_client" value="{{ form.nom_client or '' }}" required>
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="telephone">Téléphone</label>
                    <input type="text" class="form-control" id="telephone" name="telephone" value="{{ form.telephone or '' }}">
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ form.email or '' }}">
                </div>

                <div class="col-12 col-sm-6">
                    <label class="form-label" for="type_client">Type de client *</label>
                    <select class="form-select" id="type_client" name="type_client" required
                            onchange="document.getElementById('bloc-type-autre').classList.toggle('d-none', this.value !== 'autre'); document.getElementById('bloc-budget').classList.toggle('d-none', this.value !== 'investisseur');">
                        {% for valeur, libelle in types_client.items() %}
                            <option value="{{ valeur }}" {% if form.type_client == valeur %}selected{% endif %}>{{ libelle }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 col-sm-6 {% if form.type_client != 'autre' %}d-none{% endif %}" id="bloc-type-autre">
                    <label class="form-label" for="type_client_precision">Préciser le type</label>
                    <input type="text" class="form-control" id="type_client_precision" name="type_client_precision" value="{{ form.type_client_precision or '' }}">
                </div>
                <div class="col-12 col-sm-6 {% if form.type_client != 'investisseur' %}d-none{% endif %}" id="bloc-budget">
                    <label class="form-label" for="budget">Budget (KMF)</label>
                    <input type="number" step="1" min="0" class="form-control" id="budget" name="budget" value="{{ form.budget if form.budget is not none else '' }}">
                </div>

                <div class="col-12 col-sm-6">
                    <label class="form-label" for="villa_interessee">Villa intéressée</label>
                    <input type="text" class="form-control" id="villa_interessee" name="villa_interessee" value="{{ form.villa_interessee or '' }}">
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="statut">Statut *</label>
                    <select class="form-select" id="statut" name="statut" required
                            onchange="document.getElementById('bloc-relance').classList.toggle('d-none', !['rdv_cale', 'a_relancer'].includes(this.value));">
                        {% for valeur, libelle in statuts_client.items() %}
                            <option value="{{ valeur }}" {% if form.statut == valeur %}selected{% endif %}>{{ libelle }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 col-sm-6 {% if form.statut not in ('rdv_cale', 'a_relancer') %}d-none{% endif %}" id="bloc-relance">
                    <label class="form-label" for="prochaine_relance">Prochaine relance</label>
                    <input type="date" class="form-control" id="prochaine_relance" name="prochaine_relance" value="{{ form.prochaine_relance or '' }}">
                </div>

                <div class="col-12">
                    <label class="form-label" for="notes">Notes / objections</label>
                    <textarea class="form-control" id="notes" name="notes" rows="4">{{ form.notes or '' }}</textarea>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> {{ "Enregistrer" if client else "Ajouter" }}
                </button>
                <a href="{{ url_for('commercial.liste') }}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
